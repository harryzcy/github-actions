name: Prettier

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory"
        required: false
        type: string
        default: .
      harden-runner:
        description: "Harden runner"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        if: ${{ inputs.harden-runner }}
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Run prettier
        run: |
          if [ -d "src" ]; then
            dir="src"
          elif [ -d "app" ]; then
            dir="app"
          else
            dir="."
          fi

          if [ -f ".prettierrc" ]; then
            npx prettier --config .prettierrc "${dir}/**/*.{ts,tsx,js,vue,html}" --check
          else
            npx prettier "${dir}/**/*.{ts,tsx,js,vue,html}" --check
          fi
